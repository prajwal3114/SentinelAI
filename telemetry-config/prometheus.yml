global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:3000"]

  - job_name: order-service
    static_configs:
      - targets: ["order-service:3001"]